name: Bug Report
description: Report a bug in IACT-docs or Sphinx build

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug!
        Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      placeholder: |
        1. ...
        2. ...
      description: Steps to reproduce the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should happen...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happens...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      value: "Sphinx 9.0.4, Python 3.11, PlantUML 1.2025.0"
      description: "Pre-populated with typical environment; update if different"

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or attachments
      placeholder: "Optional: add screenshots or error logs"
