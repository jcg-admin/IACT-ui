name: Validate Docs

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: ['feature/**', develop, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install --upgrade pip uv

      - name: Install system deps (libenchant + Java)
        run: |
          sudo apt-get update
          sudo apt-get install -y libenchant-2-2 default-jre-headless

      - name: Bootstrap project (uv sync + plantuml.jar + hooks)
        run: bash scripts/setup.sh

      - name: Strict build (warnings as errors)
        run: |
          source .venv/bin/activate
          make clean
          sphinx-build -W -j auto -b html -d build/doctrees source build/html

      - name: Validate PlantUML consistency
        run: bash scripts/validate-plantuml.sh

      - name: Upload build artifact (PR preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-html-${{ github.event.pull_request.number || github.sha }}
          path: build/html/
          retention-days: 14
