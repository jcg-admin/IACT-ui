<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SECURITY: Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none';">
  
  <!-- SECURITY: Prevent MIME sniffing -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  
  <!-- SECURITY: Referrer Policy -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  
  <!-- SECURITY: Force HTTPS -->
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  
  <!-- Tema y estilos -->
  <title>IACT Dashboard</title>
  <style>
    /* Estilos minimos para evitar FOUT */
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #0f172a;
      color: #e2e8f0;
    }
    
    #root {
      display: flex;
      height: 100vh;
      width: 100vw;
    }
  </style>
</head>
<body>
  <!-- Root element para React -->
  <div id="root"></div>
  
  <!-- Scripts sin inline code (evitar XSS) -->
  <noscript>
    <p>Por favor, habilita JavaScript para usar esta aplicación.</p>
  </noscript>
</body>
</html>
